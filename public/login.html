<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Shop Manager</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1e3a8a,#0f172a);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .box{background:#fff;padding:40px 30px;border-radius:20px;text-align:center;max-width:360px;width:90%;box-shadow:0 20px 40px rgba(0,0,0,0.4)}
    .box h2{margin-bottom:8px;color:#1e3a8a}
w    .box p{color:#64748b;margin-bottom:24px;font-size:0.9rem}
    .box input{width:100%;padding:12px;margin:8px 0;border:2px solid #e2e8f0;border-radius:10px;font-size:0.95rem}
    .box button{width:100%;padding:12px;background:#1e3a8a;color:#fff;border:none;border-radius:10px;font-weight:600;font-size:1rem;cursor:pointer;margin-top:12px}
    .box button:hover{background:#2563eb}
    .error{color:red;margin-top:10px;font-size:0.85rem}
  </style>
</head>
<body>
  <div class="box">
    <h2>🔐 Shop Manager</h2>
    <p>Login to continue</p>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p class="error" id="error"></p>
  </div>
  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      if (!username || !password) { errorEl.textContent = 'Please fill all fields'; return; }
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.message || 'Login failed'; return; }
        localStorage.setItem('token', data.token);
        window.location.href = 'index.html';
      } catch (err) { errorEl.textContent = 'Network error'; }
    }
  </script>
</body>
</html>
