<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 QR Scanner | Shop Manager</title>
  <style>
    :root {
      --bg: #f8f9fa; --text: #212529; --surface: #ffffff;
      --border: #dee2e6; --accent: #3b82f6;
    }
    body.dark {
      --bg: #1a1a2e; --text: #e0e0e0; --surface: #16213e;
      --border: #0f3460;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; transition: 0.3s;
    }
    .topbar {
      background: linear-gradient(135deg, #1e40af, #1e3a8a); color: #fff;
      padding: 14px 20px; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 10px;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar h1 { font-size: 1.3rem; }
    .btn {
      padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.8rem;
      border: none; cursor: pointer; text-decoration: none; transition: 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    }
    .btn:hover { background: rgba(255,255,255,0.25); }
    .btn-primary { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .container { max-width: 600px; margin: 20px auto; padding: 0 20px; }

    #reader {
      width: 100%; max-width: 400px; margin: 20px auto;
      border-radius: 16px; overflow: hidden;
      border: 3px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .scan-result {
      background: var(--surface); border-radius: 14px; padding: 20px;
      margin-top: 20px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 2px solid var(--border);
    }
    .scan-result.success { border-color: #10b981; }
    .scan-result.error { border-color: #ef4444; }
    .scan-result h3 { margin-bottom: 6px; }
    .scan-result p { color: #64748b; margin: 4px 0; }

    .manual-input { margin-top: 20px; display: flex; gap: 10px; }
    .manual-input input {
      flex:1; padding:12px; border:2px solid var(--border); border-radius:10px;
      background:var(--surface); color:var(--text); font-size:0.9rem;
    }
    .log { font-size:0.75rem; color:#64748b; margin-top:12px; text-align:center; }
  </style>
</head>
<body>

<header class="topbar">
  <h1>📷 QR Scanner</h1>
  <div style="display:flex; gap:10px;">
    <a href="bill.html" class="btn">🧾 Billing</a>
    <a href="index.html" class="btn btn-primary">🏠 Dashboard</a>
  </div>
</header>

<div class="container">
  <!-- QR Reader -->
  <div id="reader"></div>

  <p style="text-align:center; margin-top:10px; color:#64748b;">Point camera at a QR code</p>

  <!-- Manual Input Fallback -->
  <div class="manual-input">
    <input type="text" id="manualInput" placeholder="Or type product ID manually...">
    <button class="btn btn-primary" onclick="manualSearch()">🔍 Find</button>
  </div>

  <!-- Scan Result -->
  <div class="scan-result" id="scanResult" style="display:none;">
    <h3 id="resultName"></h3>
    <p id="resultVariant"></p>
    <p id="resultPrice"></p>
    <p id="resultStatus" style="font-weight:600;"></p>
  </div>

  <p class="log" id="log"></p>
</div>

<!-- html5-qrcode library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
  // ========== AUTH CHECK ==========
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = 'login.html'; }

  async function authFetch(url, options = {}) {
    options.headers = {
      ...options.headers,
      'Authorization': 'Bearer ' + token
    };
    const res = await fetch(url, options);
    if (res.status === 401) {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }
    return res;
  }

  const logEl = document.getElementById('log');

  // ========== SCANNER ==========
  const html5QrCode = new Html5Qrcode("reader");

  function onScanSuccess(decodedText, decodedResult) {
    // Scanner stop করুন
    html5QrCode.stop().then(() => {
      logEl.textContent = 'Scanned: ' + decodedText;
      processScan(decodedText);
    }).catch(err => {
      logEl.textContent = 'Stop error: ' + err;
    });
  }

  function onScanFailure(error) {
    // Scanning fail – silently ignore
  }

  // Start scanner
  html5QrCode.start(
    { facingMode: "environment" }, // Rear camera
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess,
    onScanFailure
  ).then(() => {
    logEl.textContent = 'Camera started. Scanning...';
  }).catch(err => {
    logEl.textContent = '❌ Camera access denied. Please allow camera permission.';
  });

  // ========== PROCESS SCAN ==========
  async function processScan(data) {
    try {
      const product = JSON.parse(data);
      await findAndAddToCart(product);
    } catch (e) {
      await manualSearchById(data);
    }
  }

  async function manualSearch() {
    const val = document.getElementById('manualInput').value.trim();
    if (!val) return;
    try {
      const product = JSON.parse(val);
      await findAndAddToCart(product);
    } catch(e) {
      await manualSearchById(val);
    }
  }

  async function manualSearchById(id) {
    try {
      const res = await authFetch('/products');
      const products = await res.json();
      const product = products.find(p => p.id == id || p.name.toLowerCase().includes(id.toLowerCase()));
      if (product) {
        await findAndAddToCart(product);
      } else {
        showResult(false, 'Product not found');
      }
    } catch(e) {
      showResult(false, 'Error finding product');
    }
  }

  async function findAndAddToCart(product) {
    try {
      const res = await authFetch('/products');
      const products = await res.json();
      const found = products.find(p => p.id === product.id);
      if (!found) { showResult(false, 'Product not found in database'); return; }
      if (found.stock <= 0) { showResult(false, 'Out of stock!'); return; }

      // Store in localStorage for bill.html to pick up
      let cart = JSON.parse(localStorage.getItem('scannedCart') || '[]');
      const existing = cart.find(i => i.id === found.id);
      if (existing) {
        if (existing.qty < found.stock) existing.qty++;
        else { showResult(false, 'Not enough stock!'); return; }
      } else {
        cart.push({ id:found.id, name:found.name, variant:found.variant, price:found.price, stock:found.stock, qty:1 });
      }
      localStorage.setItem('scannedCart', JSON.stringify(cart));
      showResult(true, `✅ Added to cart! (Qty: ${existing ? existing.qty : 1})`);

      // ২ সেকেন্ড পর আবার স্ক্যানার চালু
      setTimeout(() => {
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          onScanFailure
        ).catch(err => {});
      }, 2000);

    } catch(e) {
      showResult(false, 'Error processing scan');
    }
  }

  function showResult(success, msg) {
    const el = document.getElementById('scanResult');
    el.style.display = 'block';
    el.className = 'scan-result ' + (success ? 'success' : 'error');
    document.getElementById('resultStatus').textContent = msg;
    if (!success) {
      document.getElementById('resultName').textContent = '';
      document.getElementById('resultVariant').textContent = '';
      document.getElementById('resultPrice').textContent = '';
    }
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark')?'dark':'light');
  }
  (function(){
    if (localStorage.getItem('theme')==='dark') document.body.classList.add('dark');
  })();
</script>
</body>
</html>
