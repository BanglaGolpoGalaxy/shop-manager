<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 QR Scanner | Shop Manager</title>
  <style>
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --text: #1e293b;
      --text-muted: #64748b; --accent: #3b82f6;
    }
    body.dark {
      --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0;
      --text-muted: #94a3b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:0.3s; }

    .topbar {
      background: linear-gradient(135deg, #1e40af, #1e3a8a); color:#fff;
      padding:14px 24px; display:flex; justify-content:space-between;
      align-items:center; flex-wrap:wrap; gap:12px;
      position:sticky; top:0; z-index:50;
    }
    .topbar h1 { font-size:1.3rem; }
    .btn {
      padding:8px 16px; border-radius:10px; font-weight:600; font-size:0.8rem;
      border:none; cursor:pointer; text-decoration:none; transition:0.2s;
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.3);
    }
    .btn-primary { background:#38bdf8; color:#0f172a; border-color:#38bdf8; }

    .container { max-width:600px; margin:20px auto; padding:0 20px; }

    /* Camera View */
    #camera-container {
      width: 100%; max-width: 400px; margin: 20px auto;
      border-radius: 16px; overflow: hidden;
      border: 3px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      background: #000;
    }
    #camera-container video { width: 100%; display: block; }

    .scan-result {
      background: var(--surface); border-radius: 14px; padding: 20px;
      margin-top: 20px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .scan-result.success { border: 2px solid #10b981; }
    .scan-result.error { border: 2px solid #ef4444; }
    .scan-result h3 { margin-bottom: 6px; }
    .scan-result p { color: var(--text-muted); margin: 4px 0; }

    .manual-input { margin-top: 20px; display: flex; gap: 10px; }
    .manual-input input {
      flex:1; padding:12px; border:2px solid var(--border); border-radius:10px;
      background:var(--surface); color:var(--text); font-size:0.9rem;
    }
    .log { font-size:0.75rem; color:var(--text-muted); margin-top:12px; text-align:center; }
  </style>
</head>
<body>

<header class="topbar">
  <h1>📷 QR Scanner</h1>
  <div style="display:flex; gap:10px;">
    <a href="bill.html" class="btn">🧾 Billing</a>
    <a href="index.html" class="btn btn-primary">🏠 Dashboard</a>
  </div>
</header>

<div class="container">
  <!-- Camera View -->
  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <p style="text-align:center; margin-top:10px; color:var(--text-muted);">Point camera at a QR code</p>

  <!-- Manual Input (Fallback) -->
  <div class="manual-input">
    <input type="text" id="manualInput" placeholder="Or type product ID manually...">
    <button class="btn btn-primary" onclick="manualSearch()">🔍 Find</button>
  </div>

  <!-- Scan Result -->
  <div class="scan-result" id="scanResult" style="display:none;">
    <h3 id="resultName"></h3>
    <p id="resultVariant"></p>
    <p id="resultPrice"></p>
    <p id="resultStatus" style="font-weight:600;"></p>
  </div>

  <p class="log" id="log"></p>
</div>

<script src="https://unpkg.com/@ericblade/quagga2@1.8.0/dist/quagga.min.js"></script>
<script>
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = 'login.html'; }

  let scanning = false;
  const logEl = document.getElementById('log');

  function log(msg) { logEl.textContent = msg; }

  async function startScanner() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.getElementById('video');
      video.srcObject = stream;
      video.play();
      log('Camera started. Scanning...');
      startScanning();
    } catch (err) {
      log('❌ Camera access denied. Please allow camera permission.');
    }
  }

  function startScanning() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    scanning = true;
    function scan() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // Simple QR detection using quagga-style approach
        // For mobile simplicity, we'll use a timer-based approach
      }
      if (scanning) requestAnimationFrame(scan);
    }
    scan();

    // Use BarcodeDetector if available (Chrome 88+)
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      async function detectLoop() {
        if (!scanning) return;
        try {
          const barcodes = await detector.detect(video);
          if (barcodes.length > 0) {
            scanning = false;
            const data = barcodes[0].rawValue;
            processScan(data);
            return;
          }
        } catch(e) {}
        setTimeout(detectLoop, 500);
      }
      detectLoop();
    } else {
      log('⚠️ BarcodeDetector not supported. Use manual input below.');
    }
  }

  function processScan(data) {
    log('Scanned: ' + data);
    try {
      const product = JSON.parse(data);
      findAndAddToCart(product);
    } catch (e) {
      manualSearchById(data);
    }
  }

  async function manualSearch() {
    const val = document.getElementById('manualInput').value.trim();
    if (!val) return;
    try {
      const product = JSON.parse(val);
      findAndAddToCart(product);
    } catch(e) {
      manualSearchById(val);
    }
  }

  async function manualSearchById(id) {
    try {
      const res = await authFetch('/products');
      const products = await res.json();
      const product = products.find(p => p.id == id || p.name.toLowerCase().includes(id.toLowerCase()));
      if (product) {
        findAndAddToCart(product);
      } else {
        showResult(false, 'Product not found');
      }
    } catch(e) {
      showResult(false, 'Error finding product');
    }
  }

  async function findAndAddToCart(product) {
    // Add to cart via bill.html's logic
    try {
      const res = await authFetch('/products');
      const products = await res.json();
      const found = products.find(p => p.id === product.id);
      if (!found) { showResult(false, 'Product not found in database'); return; }
      if (found.stock <= 0) { showResult(false, 'Out of stock!'); return; }

      // Store in localStorage for bill.html to pick up
      let cart = JSON.parse(localStorage.getItem('scannedCart') || '[]');
      const existing = cart.find(i => i.id === found.id);
      if (existing) {
        if (existing.qty < found.stock) existing.qty++;
        else { showResult(false, 'Not enough stock!'); return; }
      } else {
        cart.push({ id:found.id, name:found.name, variant:found.variant, price:found.price, stock:found.stock, qty:1 });
      }
      localStorage.setItem('scannedCart', JSON.stringify(cart));
      showResult(true, `✅ Added to cart! (Qty: ${existing ? existing.qty : 1})`);
    } catch(e) {
      showResult(false, 'Error processing scan');
    }
  }

  function showResult(success, msg) {
    const el = document.getElementById('scanResult');
    el.style.display = 'block';
    el.className = 'scan-result ' + (success ? 'success' : 'error');
    document.getElementById('resultStatus').textContent = msg;
    if (!success) {
      document.getElementById('resultName').textContent = '';
      document.getElementById('resultVariant').textContent = '';
      document.getElementById('resultPrice').textContent = '';
    }
    setTimeout(() => { scanning = true; }, 2000);
  }

  async function authFetch(url, opts = {}) {
    opts.headers = { ...opts.headers, 'Authorization': 'Bearer '+token };
    return fetch(url, opts);
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark')?'dark':'light');
  }

  (function(){
    if (localStorage.getItem('theme')==='dark') document.body.classList.add('dark');
    startScanner();
  })();
</script>
</body>
</html>
